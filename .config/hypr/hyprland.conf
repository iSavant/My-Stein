# My-Stein Quickshell Integration
# Source this from your main hyprland.conf: source = ~/.config/hypr/hyprland.conf

# Launch Quickshell
exec-once = quickshell -p ~/.config/quickshell

# Overview (Super+Tab)
bind = SUPER, Tab, exec, qs ipc call overviewToggle

# Wallpaper picker (Super+W)
bind = SUPER, W, exec, qs ipc call wallpaperToggle

# Music popup toggle (Super+M)
bind = SUPER, M, exec, qs ipc call musicToggle

# Wallpaper daemon
exec-once = swww-daemon

# Recommended: disable Hyprland's default top bar if you have one
# monitor = DP-1, preferred, auto, 1
# monitor = HDMI-A-1, preferred, auto, 1, transform, 1
